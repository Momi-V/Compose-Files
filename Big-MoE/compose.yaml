services:
  bigmoe:
    build: .
    container_name: bigmoe
    ports:
      - "8765:8765"
    group_add:
      - video
    environment:
      - TZ=Europe/Berlin
    devices:
      - /dev/dri
    volumes:
      - /mnt/hiSpeed/bigmoe:/root/bmoe
    restart: unless-stopped
    healthcheck:
      disable: true
    entrypoint: /root/start.sh