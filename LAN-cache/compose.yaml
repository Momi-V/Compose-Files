services:
  dns-server:
    container_name: dns-server
    env_file: .env
    environment:
      - DNS_SERVER_DOMAIN=dns-server.lan
      - DNS_SERVER_FORWARDERS=10.11.1.1
    hostname: dns-server
    image: technitium/dns-server:latest
    ports:
      - 5380:5380/tcp
      - 53443:53443/tcp
      - 53:53/udp
      - 53:53/tcp
      - 853:853/udp
      - 853:853/tcp
    restart: unless-stopped
    volumes:
      - /mnt/goFlash/docker/technitium:/etc/dns