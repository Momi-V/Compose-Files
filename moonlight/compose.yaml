services:
  moonlight-web:
    #image: mrcreativ3001/moonlight-web-stream:latest
    build:
      context: https://github.com/Momi-V/moonlight-web-stream.git#master:docker
      args:
        UID: 568
        GID: 568
    container_name: moonlight-web
    restart: unless-stopped
    devices:
      - /dev/dri
    network_mode: host
    #ports:
    #  - "11259:8080"
    #  - "40000-40100:40000-40100/udp"
    environment:
      - BIND_ADDRESS=0.0.0.0:11259
      - WEBRTC_PORT_RANGE=40000:40100
    volumes:
      - /mnt/goFlash/docker/moonlight:/moonlight-web/server