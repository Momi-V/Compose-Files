services:
  novnc:
    build: https://github.com/Momi-V/Compose-Files.git#main:no-vnc
    container_name: novnc-01
    ports:
      - 6080:6080
    environment:
      - SERVER=truenas.lan:5900
      - TZ=Europe/Berlin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1G
