services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /mnt/bigSpin/net/Desktop/ollama-local:/root/.ollama
    devices:
      - "/dev/dri:/dev/dri"   # Vulkan device access (Intel/AMD)
    environment:
      # To prevent slowdown on systems without ReBAR
      - GGML_VK_DISABLE_HOST_VISIBLE_VIDMEM=1
      # Improve VRAM usage with large KV
      - OLLAMA_FLASH_ATTENTION=1
      # - LLAMA_ARG_KV_OFFLOAD=disabled
      # KV Cache quantization (reduces quality)
      # - OLLAMA_KV_CACHE_TYPE=q8_0
    networks:
      - openwebui

networks:
  openwebui:
    name: openwebui