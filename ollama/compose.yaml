services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /mnt/bigSpin/net/Desktop/ollama:/root/.ollama
    devices:
      - "/dev/dri:/dev/dri"   # Vulkan device access (Intel/AMD)
    environment:
      # To prevent slowdown on systems without ReBAR
      - GGML_VK_DISABLE_HOST_VISIBLE_VIDMEM=1
      # Disable cloud features if you want local-only
      - OLLAMA_NO_CLOUD=1
      # KV Cache
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - /mnt/goFlash/docker/ollama/open-webui:/app/backend/data

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: open-terminal
    restart: unless-stopped
    depends_on:
      - ollama
      - open-webui
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
    volumes:
      - /mnt/goFlash/docker/ollama/open-terminal:/home