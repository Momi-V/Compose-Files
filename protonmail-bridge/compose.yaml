services:
  protonmail-bridge:
    image: ghcr.io/videocurio/proton-mail-bridge:latest
    container_name: protonmail_bridge
    volumes:
      - /mnt/goFlash/docker/proton:/root
    environment:
      - CONTAINER_SMTP_PORT=25
      - CONTAINER_IMAP_PORT=143
    ports:
      - 1025:25
      - 1143:143
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1G