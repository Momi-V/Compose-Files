services:
  strata:
    image: ghcr.io/niko1221/strata:latest-rocm-gfx110x
    container_name: strata
    restart: unless-stopped
    ports:
      - "${STRATA_BIND:-127.0.0.1}:${STRATA_PORT:-8080}:8080"
    environment:
      MODEL: ${MODEL:-}
      MODEL_PATH: ${MODEL_PATH:-}            # GGUF files you already have, as seen inside the container (mount them below)
      CONTEXT: ${CONTEXT:-32k}
      PARALLEL: ${PARALLEL:-}
      VISION: ${VISION:-off}
      TUNE: ${TUNE:-skip}
      API_KEY: ${API_KEY:-}
      KV: ${KV:-}
      RETUNE: ${RETUNE:-}
    volumes:
      - ./data:/data
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "${RENDER_GID:-render}"              # the host's render group id: getent group render | cut -d: -f3 (needed if you add `user:`; root does not need it)
    ulimits:
      memlock: { soft: -1, hard: -1 }
    shm_size: 2gb
    stop_grace_period: 2m
    security_opt: [seccomp:unconfined]       # only if the log says a ROCm call was blocked (rare)
